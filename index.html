    #soniclens-v01-redesign .sl-length-rail {
      display: none;
    }
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;soniclens-v01-redesign&#x27;);
  if (!root) return;

  const state = {
    frequency: 200,
    length: 0.413,
    temperature: 20,
    mode: &#x27;particles&#x27;,
    soundOn: false,
    harmonic: 1,
    amplitude: 1,
    naturalFrequency: 200
  };

  const limits = {
    frequency: [100, 2000],
    length: [0.1, 2],
    temperature: [0, 40]
  };

  const els = {
    frequencyInput: root.querySelector(&#x27;#sl-frequency-input&#x27;),
    frequencyRange: root.querySelector(&#x27;#sl-frequency-range&#x27;),
    temperatureInput: root.querySelector(&#x27;#sl-temperature-input&#x27;),
    temperatureRange: root.querySelector(&#x27;#sl-temperature-range&#x27;),
    lengthInput: root.querySelector(&#x27;#sl-length-input&#x27;),
    lengthRange: root.querySelector(&#x27;#sl-length-range&#x27;),
    frequencyError: root.querySelector(&#x27;#sl-frequency-error&#x27;),
    temperatureError: root.querySelector(&#x27;#sl-temperature-error&#x27;),
    lengthError: root.querySelector(&#x27;#sl-length-error&#x27;),
    speed: root.querySelector(&#x27;#sl-speed&#x27;),
    air: root.querySelector(&#x27;#sl-air&#x27;),
    water: root.querySelector(&#x27;#sl-water&#x27;),
    waterLine: root.querySelector(&#x27;#sl-water-line&#x27;),
    lengthTag: root.querySelector(&#x27;#sl-length-tag&#x27;),
    particles: root.querySelector(&#x27;#sl-particles&#x27;),
    pressure: root.querySelector(&#x27;#sl-pressure&#x27;),
    displacement: root.querySelector(&#x27;#sl-displacement&#x27;),
    displacementPath: root.querySelector(&#x27;#sl-displacement-path&#x27;),
    effectiveLength: root.querySelector(&#x27;#sl-effective-length&#x27;),
    statusBadge: root.querySelector(&#x27;#sl-status-badge&#x27;),
    modeName: root.querySelector(&#x27;#sl-mode-name&#x27;),
    naturalFrequency: root.querySelector(&#x27;#sl-natural-frequency&#x27;),
    deltaFrequency: root.querySelector(&#x27;#sl-delta-frequency&#x27;),
    predictedLength: root.querySelector(&#x27;#sl-predicted-length&#x27;),
    relativeAmplitude: root.querySelector(&#x27;#sl-relative-amplitude&#x27;),
    relativeDb: root.querySelector(&#x27;#sl-relative-db&#x27;),
    soundButton: root.querySelector(&#x27;#sl-sound&#x27;),
    soundState: root.querySelector(&#x27;#sl-sound-state&#x27;),
    soundStateWrap: root.querySelector(&#x27;.sl-sound-state&#x27;),
    reset: root.querySelector(&#x27;#sl-reset&#x27;)
  };

  const radius = 0.025;
  const endCorrection = 0.6133 * radius;
  const qualityFactor = 30;
  const tubeInnerHeight = 314;
  let particleData = [];
  let pressureBands = [];
  let audioContext = null;
  let oscillator = null;
  let gainNode = null;
  let audioError = false;

  function clamp(value, key) {
    return Math.min(limits[key][1], Math.max(limits[key][0], value));
  }

  function displayError(key, message) {
    els[key + &#x27;Error&#x27;].textContent = message;
  }

  function applyValue(key, rawValue, commit = false) {
    const value = Number(rawValue);
    if (!Number.isFinite(value)) {
      displayError(key, &#x27;กรุณากรอกเป็นตัวเลข&#x27;);
      return;
    }

    const [min, max] = limits[key];
    if (value &lt; min || value &gt; max) {
      displayError(key, `กรอกได้ตั้งแต่ ${min} ถึง ${max}`);
      if (!commit) return;
    } else {
      displayError(key, &#x27;&#x27;);
    }

    state[key] = clamp(value, key);
    syncControls();
    updatePhysics();
  }

  function syncControls() {
    els.frequencyInput.value = state.frequency.toFixed(0);
    els.frequencyRange.value = state.frequency;
    els.temperatureInput.value = state.temperature.toFixed(1);
    els.temperatureRange.value = state.temperature;
    els.lengthInput.value = state.length.toFixed(3);
    els.lengthRange.value = state.length;
  }

  function nearestOdd(value) {
    return Math.max(1, 2 * Math.round((value - 1) / 2) + 1);
  }

  function signed(value, digits, unit) {
    const safe = Math.abs(value) &lt; Math.pow(10, -digits) / 2 ? 0 : value;
    const sign = safe &gt; 0 ? &#x27;+&#x27; : safe &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;;
    return `${sign}${Math.abs(safe).toFixed(digits)} ${unit}`;
  }

  function updatePhysics() {
    const speed = 331 + 0.6 * state.temperature;
    const effectiveLength = state.length + endCorrection;
    const estimate = 4 * effectiveLength * state.frequency / speed;
    const harmonic = nearestOdd(estimate);
    const resonanceOrder = (harmonic + 1) / 2;
    const naturalFrequency = harmonic * speed / (4 * effectiveLength);
    const delta = state.frequency - naturalFrequency;
    const amplitude = 1 / Math.sqrt(1 + Math.pow(2 * qualityFactor * delta / naturalFrequency, 2));
    const relativeDb = 20 * Math.log10(amplitude);
    const predictedLength = harmonic * speed / (4 * state.frequency) - endCorrection;
    const inHalfPowerBand = amplitude &gt;= 1 / Math.sqrt(2);

    state.harmonic = harmonic;
    state.amplitude = amplitude;
    state.naturalFrequency = naturalFrequency;

    els.speed.textContent = `${speed.toFixed(1)} m/s`;
    els.effectiveLength.innerHTML = `L&lt;sub&gt;eff&lt;/sub&gt; = ${state.length.toFixed(3)} + ${endCorrection.toFixed(4)} = ${effectiveLength.toFixed(4)} m`;
    els.lengthTag.textContent = `L = ${state.length.toFixed(3)} m`;
    els.modeName.textContent = `ครั้งที่ ${resonanceOrder} · ฮาร์มอนิก ${harmonic}`;
    els.naturalFrequency.textContent = `${naturalFrequency.toFixed(1)} Hz`;
    els.deltaFrequency.textContent = signed(delta, 1, &#x27;Hz&#x27;);
    els.predictedLength.textContent = predictedLength &gt;= limits.length[0] &amp;&amp; predictedLength &lt;= limits.length[1]
      ? `${predictedLength.toFixed(3)} m`
      : `${predictedLength.toFixed(3)} m (นอกช่วง)`;
    els.relativeAmplitude.textContent = amplitude.toFixed(3);
    els.relativeDb.textContent = `${relativeDb.toFixed(1).replace(&#x27;-&#x27;, &#x27;−&#x27;)} dB`;
    els.statusBadge.textContent = inHalfPowerBand ? &#x27;อยู่ในแถบการสั่นพ้อง&#x27; : &#x27;ยังไม่ถึงการสั่นพ้อง&#x27;;

    const airHeight = Math.max(16, tubeInnerHeight * (state.length / limits.length[1]));
    const waterHeight = tubeInnerHeight - airHeight;
    els.air.style.height = `${airHeight}px`;
    els.water.style.height = `${waterHeight}px`;
    els.waterLine.style.top = `${airHeight}px`;
    els.lengthTag.style.top = `${Math.max(10, airHeight - 12)}px`;

    buildVisualLayers(airHeight);
    updateAudio();
  }

  function buildVisualLayers(airHeight) {
    const rowCount = Math.max(4, Math.min(26, Math.round(airHeight / 13)));
    const colCount = 5;
    els.particles.replaceChildren();
    particleData = [];

    for (let row = 0; row &lt; rowCount; row++) {
      for (let col = 0; col &lt; colCount; col++) {
        const dot = document.createElement(&#x27;span&#x27;);
        dot.className = &#x27;sl-particle&#x27;;
        const y = rowCount === 1 ? airHeight / 2 : 7 + row * Math.max(1, (airHeight - 14) / (rowCount - 1));
        const x = 14 + col * 15;
        dot.style.left = `${x}px`;
        dot.style.top = `${y}px`;
        els.particles.appendChild(dot);
        particleData.push({ dot, x, y, airHeight });
      }
    }

    const bandCount = Math.max(10, Math.min(34, Math.round(airHeight / 8)));
    els.pressure.replaceChildren();
    pressureBands = [];
    for (let i = 0; i &lt; bandCount; i++) {
      const band = document.createElement(&#x27;span&#x27;);
      band.className = &#x27;sl-pressure-band&#x27;;
      band.style.top = `${i * airHeight / bandCount}px`;
      band.style.height = `${airHeight / bandCount + 0.5}px`;
      els.pressure.appendChild(band);
      pressureBands.push({ band, y: (i + 0.5) * airHeight / bandCount, airHeight });
    }
  }

  function renderFrame(now) {
    const phase = now / 520;
    const harmonic = state.harmonic;
    const amp = state.amplitude;

    if (state.mode === &#x27;particles&#x27;) {
      for (const item of particleData) {
        const xFromClosed = state.length * (1 - item.y / item.airHeight);
        const spatial = Math.sin(harmonic * Math.PI * xFromClosed / (2 * (state.length + endCorrection)));
        const shift = 5 * amp * spatial * Math.cos(phase);
        item.dot.style.transform = `translate(-50%, calc(-50% + ${shift}px))`;
        item.dot.style.opacity = `${0.45 + 0.5 * amp}`;
      }
    } else if (state.mode === &#x27;pressure&#x27;) {
      for (const item of pressureBands) {
        const xFromClosed = state.length * (1 - item.y / item.airHeight);
        const pressure = Math.cos(harmonic * Math.PI * xFromClosed / (2 * (state.length + endCorrection))) * Math.sin(phase) * amp;
        item.band.classList.toggle(&#x27;is-positive&#x27;, pressure &gt;= 0);
        item.band.classList.toggle(&#x27;is-negative&#x27;, pressure &lt; 0);
        item.band.style.opacity = `${0.08 + 0.72 * Math.abs(pressure)}`;
      }
    } else {
      const h = Math.max(16, els.air.clientHeight);
      const points = [];
      for (let i = 0; i &lt;= 50; i++) {
        const y = i * h / 50;
        const xFromClosed = state.length * (1 - y / h);
        const spatial = Math.sin(harmonic * Math.PI * xFromClosed / (2 * (state.length + endCorrection)));
        const x = 50 + 35 * amp * spatial * Math.cos(phase);
        points.push(`${i === 0 ? &#x27;M&#x27; : &#x27;L&#x27;} ${x.toFixed(2)} ${(y * 300 / h).toFixed(2)}`);
      }
      els.displacementPath.setAttribute(&#x27;d&#x27;, points.join(&#x27; &#x27;));
    }

    requestAnimationFrame(renderFrame);
  }

  function setMode(mode) {
    state.mode = mode;
    els.particles.style.display = mode === &#x27;particles&#x27; ? &#x27;block&#x27; : &#x27;none&#x27;;
    els.pressure.style.display = mode === &#x27;pressure&#x27; ? &#x27;block&#x27; : &#x27;none&#x27;;
    els.displacement.style.display = mode === &#x27;displacement&#x27; ? &#x27;block&#x27; : &#x27;none&#x27;;

    root.querySelectorAll(&#x27;.sl-mode&#x27;).forEach(button =&gt; {
      const selected = button.dataset.mode === mode;
      button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
    });
  }

  async function toggleSound() {
    try {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error(&#x27;Web Audio API unavailable&#x27;);
        audioContext = new AudioContextClass();
        oscillator = audioContext.createOscillator();
        gainNode = audioContext.createGain();
        oscillator.type = &#x27;sine&#x27;;
        gainNode.gain.value = 0;
        oscillator.connect(gainNode).connect(audioContext.destination);
        oscillator.start();
      }

      await audioContext.resume();
      state.soundOn = !state.soundOn;
      audioError = false;
      updateAudio();
    } catch (error) {
      audioError = true;
      state.soundOn = false;
      els.soundState.textContent = &#x27;พรีวิวนี้ไม่อนุญาตให้เล่นเสียง&#x27;;
      els.soundStateWrap.classList.remove(&#x27;is-on&#x27;);
    }
  }

  function updateAudio() {
    if (oscillator &amp;&amp; audioContext) {
      oscillator.frequency.setTargetAtTime(state.frequency, audioContext.currentTime, 0.015);
      const targetGain = state.soundOn ? 0.004 + 0.055 * state.amplitude : 0;
      gainNode.gain.setTargetAtTime(targetGain, audioContext.currentTime, 0.025);
    }

    els.soundButton.setAttribute(&#x27;aria-pressed&#x27;, String(state.soundOn));
    els.soundButton.querySelector(&#x27;span&#x27;).textContent = state.soundOn ? &#x27;หยุดเสียง&#x27; : &#x27;เริ่มเสียง&#x27;;
    if (!audioError) {
      els.soundState.textContent = state.soundOn
        ? `กำลังเล่น ${state.frequency.toFixed(0)} Hz · ความดังสัมพัทธ์ ${state.amplitude.toFixed(3)}`
        : &#x27;เสียงปิดอยู่&#x27;;
      els.soundStateWrap.classList.toggle(&#x27;is-on&#x27;, state.soundOn);
    }
  }

  els.frequencyRange.addEventListener(&#x27;input&#x27;, event =&gt; applyValue(&#x27;frequency&#x27;, event.target.value));
  els.temperatureRange.addEventListener(&#x27;input&#x27;, event =&gt; applyValue(&#x27;temperature&#x27;, event.target.value));
  els.lengthRange.addEventListener(&#x27;input&#x27;, event =&gt; applyValue(&#x27;length&#x27;, event.target.value));

  [
    [&#x27;frequency&#x27;, els.frequencyInput],
    [&#x27;temperature&#x27;, els.temperatureInput],
    [&#x27;length&#x27;, els.lengthInput]
  ].forEach(([key, input]) =&gt; {
    input.addEventListener(&#x27;change&#x27;, event =&gt; applyValue(key, event.target.value, true));
    input.addEventListener(&#x27;keydown&#x27;, event =&gt; {
      if (event.key === &#x27;Enter&#x27;) {
        event.preventDefault();
        applyValue(key, event.target.value, true);
        input.blur();
      }
    });
  });

  root.querySelectorAll(&#x27;.sl-step&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const key = button.dataset.target;
      const decimals = key === &#x27;length&#x27; ? 3 : key === &#x27;temperature&#x27; ? 1 : 0;
      const next = Number((state[key] + Number(button.dataset.delta)).toFixed(decimals));
      applyValue(key, next, true);
    });
  });

  root.querySelectorAll(&#x27;.sl-mode&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; setMode(button.dataset.mode));
  });

  els.soundButton.addEventListener(&#x27;click&#x27;, toggleSound);
  els.reset.addEventListener(&#x27;click&#x27;, () =&gt; {
    state.frequency = 200;
    state.length = 0.413;
    state.temperature = 20;
    displayError(&#x27;frequency&#x27;, &#x27;&#x27;);
    displayError(&#x27;temperature&#x27;, &#x27;&#x27;);
    displayError(&#x27;length&#x27;, &#x27;&#x27;);
    syncControls();
    setMode(&#x27;particles&#x27;);
    updatePhysics();
  });

  syncControls();
  setMode(&#x27;particles&#x27;);
  updatePhysics();
  requestAnimationFrame(renderFrame);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    if (openTimeout != null) {

    pendingTrigger = null;
  };

    pinnedByTouch = false;
    positionRequest += 1;

    autoUpdateCleanup = null;

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {

    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;

    focusin: handleFocusIn,

    if (node.shadowRoot) listen(node.shadowRoot);
